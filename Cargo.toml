[package]
name = "ns-emu-cheats-downloader"
version = "0.1.6"
edition = "2024"
description = "A graphical user interface for downloading cheats for Switch emulators"
repository = "https://github.com/exefer/ns-emu-cheats-downloader"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0.104"
curl = "0.4.51"
curl-sys = "0.4.91"
eframe = { version = "0.37.0", default-features = false, features = [
  "default_fonts",
  "glow",
  "system_fonts",
  "wayland",
  "x11"
] }
egui_extras = { version = "0.37.0", default-features = false, features = [
  "image"
] }
egui_file = "0.29.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = "s"
strip = true
lto = true
panic = "abort"
codegen-units = 1
