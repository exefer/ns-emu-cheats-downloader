[package]
name = "ns-emu-cheats-downloader"
version = "0.1.5"
edition = "2024"
description = "A graphical user interface for downloading cheats for Switch emulators"
repository = "https://github.com/exefer/ns-emu-cheats-downloader"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0.101"
curl = "0.4.49"
curl-sys = "0.4.88"
eframe = { version = "0.34.3", default-features = false, features = [
  "default_fonts",
  "glow",
  "wayland",
  "x11"
] }
egui_extras = { version = "0.34.3", default-features = false, features = [
  "image"
] }
egui_file = "0.26.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[profile.release]
opt-level = "s"
strip = true
lto = true
panic = "abort"
codegen-units = 1
